<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoregia — General Connector Abstraction Layer (GCAL)</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260917">
  <link rel="stylesheet" href="css/layout.css?v=20260917">
  <link rel="stylesheet" href="css/components.css?v=20260917">
  <link rel="stylesheet" href="css/views.css?v=20260917">
  <link rel="stylesheet" href="css/command-palette.css?v=20260917">
  <link rel="stylesheet" href="css/gcal.css?v=20260920">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"/></svg></span>
      <span class="brand-wordmark">General <em>Connector</em> Abstraction Layer</span>
    </div>
    <div class="header-search">
      <span class="search-icon"><gcal-icon name="search" size="16"></gcal-icon></span>
      <input type="search" id="globalSearch" placeholder="Search executions…  ( Ctrl K )" aria-label="Search the execution log" autocomplete="off">
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">“One abstraction for every door to the outside.”</div>
      <div class="colophon-meta">— GCAL · Autoregia</div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="app-main" id="appContent"></main>

  <!-- ═══ Footer ═══ -->
  <footer class="app-footer">
    <div class="footer-rule"></div>
    <div class="footer-title">GCAL — the connection layer of the toolbox</div>
    <span class="pill gold">connectors</span>
    <div class="footer-meta">connections: <span id="footerRegister">—</span> · <span id="footerFilter">no filter</span></div>
  </footer>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-search">
      <span><gcal-icon name="search" size="18"></gcal-icon></span>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command, a connector, or a connection…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<!-- ═══ Modal ═══ -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modalTitle">—</h2>
      <button class="btn-icon" id="modalClose" aria-label="Close dialog"><gcal-icon name="x" size="16"></gcal-icon></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div id="toast" class="wm-toast" role="status" aria-live="polite"></div>

<!-- ═══ Scripts ═══ -->
<script src="/ui/js/ui.js?v=20260917"></script>
<script src="/ui/js/icons.js?v=20260917"></script>

<script src="js/store.js?v=20260920"></script>
<script src="js/icons.js?v=20260920"></script>
<script src="js/views.js?v=20260920"></script>
<script src="js/dashboard.js?v=20260920"></script>
<script src="js/connectors.js?v=20260920"></script>
<script src="js/connections.js?v=20260920"></script>
<script src="js/runner.js?v=20260920"></script>
<script src="js/executions.js?v=20260920"></script>
<script src="js/audit.js?v=20260920"></script>
<script src="js/self-monitoring.js?v=20260920"></script>
<script src="js/settings.js?v=20260920"></script>
<script src="js/app.js?v=20260920"></script>
<script src="js/command-palette.js?v=20260920"></script>

</body>
</html>

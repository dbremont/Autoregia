<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CES — Computation Execution System</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/standalone.css?v=20260917">
<style>
  /* Autoregia warm-parchment aesthetic — tokens per design.md / spec/ui.spec */
  :root {
    --green: var(--color-success);
    --green-bg: var(--color-success-light);
    --amber: var(--color-warning);
    --amber-bg: var(--color-warning-light);
    /* compat aliases referenced inline by exec.js (CES DOM contract) */
    --text-dim: var(--faint);
    --red: var(--oxford);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 1000px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
    line-height: 1.55;
  }
  a.back {
    display: inline-block; font-size: var(--text-2sm); letter-spacing: .14em;
    text-transform: uppercase; color: var(--color-text-muted); text-decoration: none; margin-top: var(--space-3);
  }
  a.back:hover { color: var(--oxford); }
  a.back::before { content: "← "; }
  nav.topnav {
    position: sticky; top: 0; z-index: var(--z-sticky);
    background: var(--paper);
    border-bottom: 1px solid var(--rule-soft);
  }
  nav.topnav .topnav-in {
    max-width: 1000px; margin: 0 auto; padding: 0 2rem;
    display: flex; align-items: center; height: 60px; gap: 18px;
  }
  nav.topnav .lockup {
    font-family: var(--serif); font-size: var(--text-lg); font-weight: 500;
    letter-spacing: -.01em; color: var(--ink); text-decoration: none;
  }
  nav.topnav .links { margin-left: auto; display: flex; gap: 26px; }
  nav.topnav .links a {
    font-family: var(--sans); font-size: var(--text-sm); color: var(--muted);
    text-decoration: none; padding: var(--space-1) 0;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  nav.topnav .links a:hover { color: var(--oxford); border-bottom-color: var(--oxford); }
  header.masthead { padding: var(--space-4) 0 var(--space-2); text-align: center; }
  .eyebrow {
    font-size: var(--text-xs); letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: var(--space-3);
  }
  h1 {
    font-family: var(--serif); font-size: var(--text-2xl); font-weight: 400;
    letter-spacing: -.015em; color: var(--ink);
  }
  .subtitle {
    font-family: var(--serif); font-style: italic;
    color: var(--muted); font-size: var(--text-md); margin-top: 6px;
  }
  .gold-rule { height: 1px; background: var(--gold); width: 64px; margin: 22px auto var(--space-2); opacity: .7; }
  h2 {
    font-family: var(--serif); font-size: var(--text-lg); font-weight: 500;
    margin: 1.6rem 0 .7rem; color: var(--ink);
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .env-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .75rem;
  }
  .env-card {
    background: var(--surface-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 6px;
    padding: .75rem;
  }
  .env-card .name { font-weight: 500; color: var(--ink); }
  .env-card .meta { font-size: var(--text-sm); color: var(--muted); margin-top: .25rem; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 0.4rem;
  }
  .status-ready { background: var(--green); }
  .status-busy { background: var(--amber); }
  .status-error { background: var(--oxford); }
  label { display: block; font-size: var(--text-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
  select, textarea, input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    padding: .6rem;
    font-family: var(--mono);
    font-size: var(--text-sm);
    margin-bottom: .75rem;
  }
  select:focus, textarea:focus, input:focus { outline: 2px solid var(--oxford); outline-offset: -1px; }
  textarea { min-height: 120px; resize: vertical; }
  button {
    background: var(--oxford);
    color: #FAF1E6;
    border: none;
    border-radius: 6px;
    padding: .6rem 1.2rem;
    font-family: var(--sans);
    font-size: var(--text-base);
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--oxford-deep); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .session { border-bottom: 1px solid var(--rule-soft); padding: .75rem 0; }
  .session:last-child { border-bottom: none; }
  .session .head {
    display: flex; justify-content: space-between; align-items: center;
  }
  .session .exe-id { font-family: var(--mono); font-size: var(--text-sm); color: var(--muted); }
  .session .payload { font-family: var(--mono); font-size: var(--text-sm); margin: .4rem 0; color: var(--ink-soft); }
  .session .output {
    background: var(--surface-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 4px;
    padding: .5rem;
    font-family: var(--mono);
    font-size: var(--text-sm);
    white-space: pre-wrap;
    margin-top: .4rem;
    max-height: 200px;
    overflow: auto;
  }
  .badge {
    display: inline-block;
    padding: .1rem .5rem;
    border-radius: 4px;
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: .04em;
  }
  .badge-completed { background: var(--green-bg); color: var(--green); }
  .badge-failed { background: var(--oxford-tint); color: var(--oxford); }
  .badge-timed_out { background: var(--amber-bg); color: var(--amber); }
  .actions { display: flex; gap: .5rem; align-items: center; }
  .actions .danger {
    background: none;
    border: 1px solid var(--oxford);
    color: var(--oxford);
  }
  .actions .danger:hover { background: var(--oxford-tint); }
  .spacer { flex: 1; }
  footer { margin-top: 2.5rem; text-align: center; font-family: var(--mono); font-size: var(--text-2sm); color: var(--color-text-muted); }
.empty-note{padding:var(--space-5);text-align:center;color:var(--text-dim);
  font-family:var(--font-display);font-style:italic;font-size:var(--text-sm)}
.cmd-palette-overlay{position:fixed;inset:0;z-index:var(--z-palette);background:rgba(30,28,25,0.38);
  display:flex;justify-content:center;padding-top:14vh;backdrop-filter:blur(4px)}
.cmd-palette-overlay.hidden{display:none}
.cmd-palette{width:min(560px,92vw);background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);overflow:hidden}
.cmd-search-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);
  border-bottom:1px solid var(--color-border-light);color:var(--color-text-muted)}
.cmd-search-row input{flex:1;border:none;background:none;font-size:var(--text-md);color:var(--ink-0);
  font-family:var(--sans);padding:0}
.cmd-results{max-height:320px;overflow-y:auto}
.cmd-result-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);
  cursor:pointer;border-left:2px solid transparent;color:var(--color-text)}
.cmd-result-item:hover,.cmd-result-item.active{background:var(--oxford-bg);border-left-color:var(--rule-gold)}
.cmd-result-item .t{font-size:var(--text-sm);font-weight:500}
@media (prefers-reduced-motion: reduce){*,:before,:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="lockup" href="/index.html">Autoregia</a>
      <div class="links">
        <a href="/ate/">Toolbox</a>
        <a href="/aoos/">AOOS</a>
        <a href="/mad/">MAD</a>
        <a href="/about.html">About</a>
        <a href="/docs.html">Docs</a>
      </div>
    </div>
  </nav>
  <main>
  <header class="masthead">
    <div class="eyebrow">Execution</div>
    <h1>CES</h1>
    <div class="subtitle">Computation Execution System — Prototype</div>
    <div class="gold-rule"></div>
  </header>

  <h2>Environments</h2>
  <div class="panel"><div class="env-grid" id="env-grid"></div></div>

  <h2>Execute</h2>
  <div class="panel">
    <label for="env-select">Environment</label>
    <select id="env-select"></select>
    <label for="work-type">Work Type</label>
    <select id="work-type">
      <option value="command">Shell Command</option>
      <option value="python">Python Script</option>
    </select>
    <label for="payload">Payload</label>
    <textarea id="payload" placeholder="echo hello"></textarea>
    <div class="actions">
      <button id="run-btn" onclick="run()"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-2px;margin-right: 5px"><polygon points="6 3 20 12 6 21 6 3"/></svg>Run</button> <span id="run-status" style="font-size:var(--text-sm);color:var(--muted)"></span>
      <span class="spacer"></span>
      <button class="danger" onclick="clearSessions()">Clear History</button>
    </div>
  </div>

  <h2>Execution History</h2>
  <div class="panel"><div id="session-list"></div></div>

    </main>
  <footer>CES · Execution — VSM System 1</footer>


<!-- ═══ Command Palette (Ctrl/Cmd+K) ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-search-row">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command…" autocomplete="off">
      <span class="kbd">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<script src="/ui/js/ui.js?v=20260917"></script>
<script src="/ate/tool/ces/js/exec.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWES — Automated Work Execution System</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260916">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260916">
  <link rel="stylesheet" href="/ui/css/standalone.css?v=20260916">
<style>
  /* Autoregia warm-parchment aesthetic — tokens per design.md / spec/ui.spec */
  :root {
    --green: var(--color-success);
    --green-bg: var(--color-success-light);
    --amber: var(--color-warning);
    --amber-bg: var(--color-warning-light);
    /* compat aliases referenced inline by exec.js (AWES DOM contract) */
    --text-dim: var(--faint);
    --red: var(--oxford);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    max-width: 1000px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
    line-height: 1.55;
  }
  a.back {
    display: inline-block; font-size: var(--text-2sm); letter-spacing: .14em;
    text-transform: uppercase; color: var(--faint); text-decoration: none; margin-top: 12px;
  }
  a.back:hover { color: var(--oxford); }
  a.back::before { content: "← "; }
  nav.topnav {
    position: sticky; top: 0; z-index: var(--z-sticky);
    background: var(--paper);
    border-bottom: 1px solid var(--rule-soft);
  }
  nav.topnav .topnav-in {
    max-width: 1000px; margin: 0 auto; padding: 0 2rem;
    display: flex; align-items: center; height: 60px; gap: 18px;
  }
  nav.topnav .lockup {
    font-family: var(--serif); font-size: var(--text-lg); font-weight: 500;
    letter-spacing: -.01em; color: var(--ink); text-decoration: none;
  }
  nav.topnav .links { margin-left: auto; display: flex; gap: 26px; }
  nav.topnav .links a {
    font-family: var(--sans); font-size: var(--text-sm); color: var(--muted);
    text-decoration: none; padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  nav.topnav .links a:hover { color: var(--oxford); border-bottom-color: var(--oxford); }
  header.masthead { padding: 16px 0 8px; text-align: center; }
  .eyebrow {
    font-size: var(--text-xs); letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 12px;
  }
  h1 {
    font-family: var(--serif); font-size: var(--text-2xl); font-weight: 400;
    letter-spacing: -.015em; color: var(--ink);
  }
  .subtitle {
    font-family: var(--serif); font-style: italic;
    color: var(--muted); font-size: var(--text-md); margin-top: 6px;
  }
  .gold-rule { height: 1px; background: var(--gold); width: 64px; margin: 22px auto 8px; opacity: .7; }
  h2 {
    font-family: var(--serif); font-size: var(--text-lg); font-weight: 500;
    margin: 1.6rem 0 .7rem; color: var(--ink);
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .env-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .75rem;
  }
  .env-card {
    background: var(--surface-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 6px;
    padding: .75rem;
  }
  .env-card .name { font-weight: 500; color: var(--ink); }
  .env-card .meta { font-size: var(--text-sm); color: var(--muted); margin-top: .25rem; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 0.4rem;
  }
  .status-ready { background: var(--green); }
  .status-busy { background: var(--amber); }
  .status-error { background: var(--oxford); }
  label { display: block; font-size: var(--text-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
  select, textarea, input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    padding: .6rem;
    font-family: var(--mono);
    font-size: var(--text-sm);
    margin-bottom: .75rem;
  }
  select:focus, textarea:focus, input:focus { outline: 2px solid var(--oxford); outline-offset: -1px; }
  textarea { min-height: 120px; resize: vertical; }
  button {
    background: var(--oxford);
    color: #FAF1E6;
    border: none;
    border-radius: 6px;
    padding: .6rem 1.2rem;
    font-family: var(--sans);
    font-size: var(--text-base);
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--oxford-deep); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .session { border-bottom: 1px solid var(--rule-soft); padding: .75rem 0; }
  .session:last-child { border-bottom: none; }
  .session .head {
    display: flex; justify-content: space-between; align-items: center;
  }
  .session .exe-id { font-family: var(--mono); font-size: var(--text-sm); color: var(--muted); }
  .session .payload { font-family: var(--mono); font-size: var(--text-sm); margin: .4rem 0; color: var(--ink-soft); }
  .session .output {
    background: var(--surface-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 4px;
    padding: .5rem;
    font-family: var(--mono);
    font-size: var(--text-sm);
    white-space: pre-wrap;
    margin-top: .4rem;
    max-height: 200px;
    overflow: auto;
  }
  .badge {
    display: inline-block;
    padding: .1rem .5rem;
    border-radius: 4px;
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: .04em;
  }
  .badge-completed { background: var(--green-bg); color: var(--green); }
  .badge-failed { background: var(--oxford-tint); color: var(--oxford); }
  .badge-timed_out { background: var(--amber-bg); color: var(--amber); }
  .actions { display: flex; gap: .5rem; align-items: center; }
  .actions .danger {
    background: none;
    border: 1px solid var(--oxford);
    color: var(--oxford);
  }
  .actions .danger:hover { background: var(--oxford-tint); }
  .spacer { flex: 1; }
  footer { margin-top: 2.5rem; text-align: center; font-family: var(--mono); font-size: var(--text-2sm); color: var(--faint); }
</style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-in">
      <a class="lockup" href="/index.html">Autoregia</a>
      <div class="links">
        <a href="/ate/">Toolbox</a>
        <a href="/aoos/">AOOS</a>
        <a href="/pbs/">PBS</a>
        <a href="/about.html">About</a>
        <a href="/docs.html">Docs</a>
      </div>
    </div>
  </nav>
  <header class="masthead">
    <div class="eyebrow">Execution</div>
    <h1>AWES</h1>
    <div class="subtitle">Automated Work Execution System — Prototype</div>
    <div class="gold-rule"></div>
  </header>

  <h2>Environments</h2>
  <div class="panel"><div class="env-grid" id="env-grid"></div></div>

  <h2>Execute</h2>
  <div class="panel">
    <label for="env-select">Environment</label>
    <select id="env-select"></select>
    <label for="work-type">Work Type</label>
    <select id="work-type">
      <option value="command">Shell Command</option>
      <option value="python">Python Script</option>
    </select>
    <label for="payload">Payload</label>
    <textarea id="payload" placeholder="echo hello"></textarea>
    <div class="actions">
      <button id="run-btn" onclick="run()"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-2px;margin-right:5px"><polygon points="6 3 20 12 6 21 6 3"/></svg>Run</button>
      <span id="run-status" style="font-size:var(--text-sm);color:var(--muted)"></span>
      <span class="spacer"></span>
      <button class="danger" onclick="clearSessions()">Clear History</button>
    </div>
  </div>

  <h2>Execution History</h2>
  <div class="panel"><div id="session-list"></div></div>

  <footer>AWES · Execution — VSM System 1</footer>

<script src="/ate/tool/awes/js/exec.js"></script>
</body>
</html>

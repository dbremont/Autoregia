<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoregia — Computation Task Execution (CTES)</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260917">
  <link rel="stylesheet" href="css/layout.css?v=20260917">
  <link rel="stylesheet" href="css/components.css?v=20260917">
  <link rel="stylesheet" href="css/views.css?v=20260917">
  <link rel="stylesheet" href="css/command-palette.css?v=20260917">
  <link rel="stylesheet" href="css/ctes.css?v=20260917">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5L18.5 10.5H12l1-8.5Z"/></svg></span>
      <span class="brand-wordmark">Computation Task <em>Execution</em></span>
    </div>
    <div class="header-search">
      <span class="search-icon"><ctes-icon name="search" size="16"></ctes-icon></span>
      <input type="search" id="globalSearch" placeholder="Search runs, handles, specs…  ( Ctrl K )" aria-label="Search runs, handles and task specs" autocomplete="off">
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">“Specified work, carried to a result.”</div>
      <div class="colophon-meta">— CTES · Autoregia</div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="app-main" id="appContent"></main>

  <!-- ═══ Footer ═══ -->
  <footer class="app-footer">
    <div class="footer-rule"></div>
    <div class="footer-title">CTES — the task-lifecycle layer of the toolbox</div>
    <span class="pill gold">execution</span>
    <div class="footer-meta">register: <span id="footerRegister">—</span> · <span id="footerFilter">no filter</span></div>
  </footer>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-search">
      <span><ctes-icon name="search" size="18"></ctes-icon></span>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command, a handle, or a run…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div id="toast" class="wm-toast" role="status" aria-live="polite"></div>

<!-- ═══ Scripts ═══ -->
<script src="js/vendor/echarts.min.js?v=20260917"></script>
<script src="/ui/js/ui.js?v=20260917"></script>
<script src="/ui/js/icons.js?v=20260917"></script>

<script src="js/store.js?v=20260917"></script>
<script src="js/icons.js?v=20260917"></script>
<script src="js/views.js?v=20260917"></script>
<script src="js/dashboard.js?v=20260917"></script>
<script src="js/handlers.js?v=20260917"></script>
<script src="js/tasks.js?v=20260917"></script>
<script src="js/runs.js?v=20260917"></script>
<script src="js/audit.js?v=20260917"></script>
<script src="js/self-monitoring.js?v=20260917"></script>
<script src="js/settings.js?v=20260917"></script>
<script src="js/app.js?v=20260917"></script>
<script src="js/command-palette.js?v=20260917"></script>

</body>
</html>

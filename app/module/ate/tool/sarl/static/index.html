<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoregia — Revisión Lingüística (SARL)</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260917">
  <link rel="stylesheet" href="css/layout.css?v=20260917">
  <link rel="stylesheet" href="css/components.css?v=20260917">
  <link rel="stylesheet" href="css/views.css?v=20260917">
  <link rel="stylesheet" href="css/command-palette.css?v=20260917">
  <link rel="stylesheet" href="css/sarl.css?v=20260919c">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></span>
      <span class="brand-wordmark">Revisión <em>Lingüística</em></span>
    </div>
    <div class="header-search">
      <span class="search-icon"><sarl-icon name="search" size="16"></sarl-icon></span>
      <input type="search" id="globalSearch" placeholder="Search tasks…  ( Ctrl K )" aria-label="Search text edition tasks" autocomplete="off">
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">“No compone nada: verifica y corrige lo que ya existe.”</div>
      <div class="colophon-meta">— SARL · Autoregia</div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="app-main" id="appContent"></main>

  <!-- ═══ Footer ═══ -->
  <footer class="app-footer">
    <div class="footer-rule"></div>
    <div class="footer-title">SARL — the copy editor's pass of the toolbox</div>
    <span class="pill gold">language review</span>
    <div class="footer-meta">tasks: <span id="footerRegister">—</span> · <span id="footerFilter">no filter</span></div>
  </footer>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-search">
      <span><sarl-icon name="search" size="18"></sarl-icon></span>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command, a task, or a glossary…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<!-- ═══ Modal ═══ -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modalTitle">—</h2>
      <button class="btn-icon" id="modalClose" aria-label="Close dialog"><sarl-icon name="x" size="16"></sarl-icon></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div id="toast" class="wm-toast" role="status" aria-live="polite"></div>

<!-- ═══ Scripts ═══ -->
<script src="/ui/js/ui.js?v=20260917"></script>

<script src="js/store.js?v=20260919b"></script>

<script src="js/review.js?v=20260919b"></script>
<script src="js/tasks.js?v=20260919c"></script>
<script src="js/glossaries.js?v=20260917"></script>
<script src="js/phrases.js?v=20260917"></script>
<script src="js/audit.js?v=20260919b"></script>
<script src="js/self-monitoring.js?v=20260917"></script>
<script src="js/settings.js?v=20260917"></script>
<script src="js/app.js?v=20260919b"></script>
<script src="js/command-palette.js?v=20260919c"></script>

</body>
</html>

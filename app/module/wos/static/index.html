<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoregia — World Observation (WOS)</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260917">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/command-palette.css">
  <link rel="stylesheet" href="css/wos.css">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg></span>
      <span class="brand-wordmark">World <em>Observation</em> System</span>
    </div>
    <div class="header-search">
      <span class="search-icon"><wos-icon name="search" size="16"></wos-icon></span>
      <input type="search" id="globalSearch" placeholder="Search the global stream…  ( Ctrl K )" aria-label="Search the global stream" autocomplete="off">
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">“Observations that drive intelligibility.”</div>
      <div class="colophon-meta">— WOS · Autoregia </div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="app-main" id="appContent"></main>

  <!-- ═══ Footer ═══ -->
  <footer class="app-footer">
    <div class="footer-rule"></div>
    <div class="footer-title">WOS — analytical instruments for external observation</div>
    <span class="pill gold">observational</span>
    <div class="footer-meta">window: <span id="footerWindow">7d</span> · <span id="footerFilter">no filter</span></div>
  </footer>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-search">
      <span><wos-icon name="search" size="18"></wos-icon></span>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command or search the stream…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<!-- ═══ Scratchpad ═══ -->
<div class="scratchpad-overlay hidden" id="scratchpadOverlay">
  <div class="scratchpad">
    <div class="scratchpad-header">
      <h3 style="margin:0;font-size:var(--text-base);">Quick Filter</h3>
      <button class="btn-icon" aria-label="Close scratchpad" onclick="WOS.scratchpad.close()"><wos-icon name="x" size="17"></wos-icon></button>
    </div>
    <div class="scratchpad-body">
      <textarea id="scratchpadText" placeholder="Type a phrase to filter the observation stream…"></textarea>
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);justify-content:flex-end;">
        <button class="btn btn-secondary btn-sm" onclick="WOS.scratchpad.close()">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="WOS.scratchpad.save()">Filter</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Scripts ═══ -->
<script src="js/vendor/echarts.min.js"></script>
<script src="js/vendor/echarts-wordcloud.min.js"></script>
<script src="js/store.js"></script>
<script src="js/vader.js"></script>
<script src="/ui/js/ui.js?v=20260917"></script>
<script src="/ui/js/icons.js?v=20260917"></script>

<script src="js/icons.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/flow.js"></script>
<script src="js/composition.js"></script>
<script src="js/landscape.js"></script>
<script src="js/clusters.js"></script>
<script src="js/search.js"></script>
<script src="js/sources.js"></script>
<script src="js/app.js"></script>
<script src="js/command-palette.js"></script>
<script src="js/scratchpad.js"></script>

</body>
</html>

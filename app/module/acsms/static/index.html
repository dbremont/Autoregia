<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoregia — Capability Self-Management (ACSMS)</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260917">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260917">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/command-palette.css">
  <link rel="stylesheet" href="css/acsms.css">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1.8l8.9 5.1v10.2L12 22.2l-8.9-5.1V6.9L12 1.8z"/><path d="M12 5.2l3.7 6.8L12 18.8l-3.7-6.8L12 5.2z"/><path d="M4.8 12h14.4"/></svg></span>
      <div class="brand-lockup">
        <span class="brand-wordmark">Capability <em>Self-Management</em> System</span>
        <span class="brand-tagline">Build <span class="tag-dot">·</span> Practice <span class="tag-dot">·</span> Grow</span>
      </div>
    </div>
    <div class="header-search">
      <span class="search-icon"><acsms-icon name="search" size="16"></acsms-icon></span>
      <input type="search" id="globalSearch" placeholder="Search skills, keywords, or topics…  ( / )" aria-label="Search the skill catalog" autocomplete="off">
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">“Exposure is not acquisition — output is the test.”</div>
      <div class="colophon-meta">— ACSMS · Autoregia</div>
    </div>
  </aside>

  <!-- ═══ Main ═══ -->
  <main class="app-main" id="appContent"></main>

  <!-- ═══ Footer ═══ -->
  <footer class="app-footer">
    <div class="footer-rule"></div>
    <div class="footer-title">ACSMS — the improvement engine: deliberate growth of capability</div>
    <span class="pill gold">substrate · System 4 inward</span>
    <div class="footer-meta" id="footerMeta"></div>
  </footer>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-palette-search">
      <span><acsms-icon name="search" size="18"></acsms-icon></span>
      <input type="text" id="cmdInput" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cmdResults" aria-label="Search commands" placeholder="Type a command or search the catalog…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults" role="listbox" aria-label="Command results"></div>
  </div>
</div>

<!-- ═══ Quick Capture (self-report practice) ═══ -->
<div class="scratchpad-overlay hidden" id="captureOverlay">
  <div class="scratchpad">
    <div class="scratchpad-header">
      <h3 style="margin:0;font-size:var(--text-base);">Log practice — quick capture</h3>
      <button class="btn-icon" aria-label="Close quick capture" onclick="ACSMS.capture.close()"><acsms-icon name="x" size="17"></acsms-icon></button>
    </div>
    <div class="scratchpad-body" id="captureForm"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="ACSMS.capture.close()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="qc-save">Record practice</button>
    </div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div id="toast" class="wm-toast" role="status" aria-live="polite"></div>

<!-- ═══ Scripts ═══ -->
<script src="js/store.js"></script>
<script src="/ui/js/ui.js?v=20260917"></script>
<script src="/ui/js/icons.js?v=20260917"></script>

<script src="js/icons.js"></script>
<script src="js/views.js"></script>
<script src="js/charts.js"></script>
<script src="js/practice.js"></script>
<script src="js/skills.js"></script>
<script src="js/paths.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/about.js"></script>
<script src="js/settings.js"></script>
<script src="js/command-palette.js"></script>
<script src="js/capture.js"></script>
<script src="js/app.js"></script>

</body>
</html>

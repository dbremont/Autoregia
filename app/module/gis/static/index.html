<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS — General Index System</title>
  <link rel="stylesheet" href="/ui/css/tokens.css?v=20260916">
  <link rel="stylesheet" href="/ui/css/fonts.css?v=20260916">
  <link rel="stylesheet" href="/ui/css/base.css?v=20260916">
  <link rel="stylesheet" href="/gis/css/fonts.css?v=20260910">
  <link rel="stylesheet" href="/gis/css/base.css?v=20260910">
  <link rel="stylesheet" href="/gis/css/layout.css?v=20260910">
  <link rel="stylesheet" href="/gis/css/components.css?v=20260910">
  <link rel="stylesheet" href="/gis/css/views.css?v=20260910">
  <link rel="stylesheet" href="/gis/css/command-palette.css?v=20260910">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ═══ -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-monogram" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h4M16 14v4M20 18v3M14 18h3"/></svg></span>
      <span class="brand-wordmark">General <em>Index</em> System</span>
    </div>
    <div class="header-search">
      <span class="search-glyph"><pt-icon name="search" size="13"></pt-icon></span>
      <input type="search" id="globalSearch" aria-label="Search the index" placeholder='Search the index… (e.g. "python", "database", "DR")' autocomplete="off">
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="btnImport" title="Import (JSON)"><pt-icon name="upload" size="15"></pt-icon> Import</button>
      <button class="btn btn-primary btn-sm" id="btnNewEntry" title="New Entry (N)"><pt-icon name="plus" size="15"></pt-icon> New Entry</button>
    </div>
  </header>

  <!-- ═══ Sidebar ═══ -->
  <aside class="app-sidebar">
    <nav class="sidebar-section">
      <div class="sidebar-label">Main</div>
      <ul class="sidebar-nav">
        <li><a href="#index" data-view="index"><span class="nav-icon"><pt-icon name="list" size="17"></pt-icon></span> Index</a></li>
        <li><a href="#dashboard" data-view="dashboard"><span class="nav-icon"><pt-icon name="gauge" size="17"></pt-icon></span> Dashboard</a></li>
        <li><a href="#graph" data-view="graph"><span class="nav-icon"><pt-icon name="share-2" size="17"></pt-icon></span> Graph</a></li>
      </ul>
    </nav>

    <nav class="sidebar-section">
      <div class="sidebar-label">Reference</div>
      <ul class="sidebar-nav">
        <li><a href="#sources" data-view="sources"><span class="nav-icon"><pt-icon name="database" size="17"></pt-icon></span> Data Sources</a></li>
        <li><a href="#handbook" data-view="handbook"><span class="nav-icon"><pt-icon name="book-open" size="17"></pt-icon></span> Documentation</a></li>
        <li><a href="#about" data-view="about"><span class="nav-icon"><pt-icon name="info" size="17"></pt-icon></span> About</a></li>
      </ul>
    </nav>

    <nav class="sidebar-section">
      <div class="sidebar-label">Toolbox</div>
      <ul class="sidebar-nav">
        <li><a href="#export" data-view="export"><span class="nav-icon"><pt-icon name="download" size="17"></pt-icon></span> Export</a></li>
      </ul>
    </nav>

    <div class="sidebar-colophon">
      <div class="colophon-rule"></div>
      <div class="colophon-title">GIS · Intelligence System</div>
      <div class="colophon-meta">VSM SYSTEM 4 — v0.2</div>
    </div>
  </aside>

  <!-- ═══ Main Content ═══ -->
  <main class="app-main" id="appContent"></main>

</div>

<!-- ═══ Command Palette ═══ -->
<div class="cmd-palette-overlay hidden" id="cmdPalette">
  <div class="cmd-palette">
    <div class="cmd-palette-search">
      <span><pt-icon name="search" size="18"></pt-icon></span>
      <input type="text" id="cmdInput" placeholder="Type a command or search entries…" autocomplete="off">
      <span class="kbd-hint">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults"></div>
  </div>
</div>

<!-- ═══ Entry Editor Modal ═══ -->
<div class="modal-overlay hidden" id="entryModal">
  <div class="modal" style="max-width:860px;">
    <div class="modal-header">
      <h2 id="entryModalTitle">New Entry</h2>
      <button class="btn-icon" aria-label="Close editor" onclick="PT.Entry.closeEditor()"><pt-icon name="x" size="17"></pt-icon></button>
    </div>
    <div class="modal-body" id="entryModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" onclick="PT.Entry.closeEditor()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="btnSaveEntry">Save Entry</button>
    </div>
  </div>
</div>

<!-- ═══ Entry Detail Modal ═══ -->
<div class="modal-overlay hidden" id="detailModal">
  <div class="modal" style="max-width:880px;">
    <div class="modal-header">
      <h2 id="detailTitle">Entry Detail</h2>
      <button class="btn-icon" aria-label="Close details" onclick="PT.Entry.closeDetail()"><pt-icon name="x" size="17"></pt-icon></button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- ═══ Hidden file input for import ═══ -->
<input type="file" id="importFile" accept="application/json" style="display:none">

<!-- ═══ Toast ═══ -->
<div class="toast" id="toast"></div>

<script src="/gis/js/vendor/echarts.min.js"></script>
<script src="/gis/js/store.js?v=20260910"></script>
<script src="/gis/js/icons.js?v=20260910"></script>
<script src="/gis/js/charts.js?v=20260910"></script>
<script src="/gis/js/app.js?v=20260910"></script>
<script src="/gis/js/search.js?v=20260910"></script>
<script src="/gis/js/entry.js?v=20260910"></script>
<script src="/gis/js/dashboard.js?v=20260910"></script>
<script src="/gis/js/relations.js?v=20260910"></script>
<script src="/gis/js/analysis.js?v=20260910"></script>
<script src="/gis/js/home.js?v=20260910"></script>
<script src="/gis/js/reference.js?v=20260910"></script>
<script src="/gis/js/command-palette.js?v=20260910"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { PT.init(); });
</script>

</body>
</html>
